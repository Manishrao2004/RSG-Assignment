[project]
name = "sales-bi-assistant"
version = "0.1.0"
description = "A traceable natural-language sales analytics assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langchain-groq>=1.1.3",
    "sqlglot>=30.25.0",
    "langsmith>=0.14.15",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
extend-exclude = [".uv-cache", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
